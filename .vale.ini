StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Quilon

[docs/**/*.md]
BasedOnStyles = Quilon
# Inline code spans (`NotOk`, `assert`, ...) are identifiers, not prose --
# never subject to the writing-style rules below.
TokenIgnores = (\x60[^\x60\n]+\x60)

[editors/vscode/README.md]
BasedOnStyles = Quilon
TokenIgnores = (\x60[^\x60\n]+\x60)
# This is the extension's own tooling README, not language-reference prose:
# it names TypeScript/pnpm/oxlint because that's what it's built with, not as
# a comparison to Quilon.
Quilon.Comparison = NO

# Planning/status pages carry decisions, gaps and history by nature -- the
# ISO writing rule below is scoped to the language reference, not these.
[docs/ORCHESTRATION.md]
BasedOnStyles =

[docs/ROADMAP.md]
BasedOnStyles =

[docs/status/*.md]
BasedOnStyles =

[CHANGELOG.md]
BasedOnStyles =
