name: Docs site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'editors/vscode/syntaxes/**'

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: site

      - name: Build the site
        working-directory: site
        run: pnpm build
