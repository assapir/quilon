name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # Platform-independent, so it runs once and the platforms wait on it. A style or
  # lint failure fails here rather than four times over.
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Boehm GC; quilon-rt's build script compiles it from source.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM 22
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # llvm-sys links statically, so it needs the dev libs and libPolly.a.
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gate-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gate-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # What only a real machine of that shape can answer: the build, the tests, and the
  # numbers. Only the install step differs between them.
  build-and-test:
    name: build-and-test (${{ matrix.key }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            runner: ubuntu-latest
            pkg: apt
          - key: linux-aarch64
            runner: ubuntu-24.04-arm
            pkg: apt
          - key: macos-arm64
            runner: macos-latest
            pkg: brew
          - key: arch-linux
            runner: ubuntu-latest
            container: archlinux:latest
            pkg: pacman

    steps:
      # Before checkout: without git in the image it downloads a tarball, which
      # silently omits the bdwgc submodule.
      - name: Install toolchain (pacman)
        if: matrix.pkg == 'pacman'
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm git base-devel llvm clang curl
          git config --global --add safe.directory '*'
          llvm-config --version
          echo "LLVM_SYS_221_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies (apt)
        if: matrix.pkg == 'apt'
        run: |
          set -euxo pipefail
          # Both linkers: the JIT/AOT parity gate exercises each.
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install LLVM 22 (brew)
        if: matrix.pkg == 'brew'
        run: |
          set -euxo pipefail
          brew update
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.key }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.key }}-cargo-

      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Test
        run: cargo test --workspace --verbose

      # corelib too: an imported module's test blocks are dropped, so a corelib
      # suite only runs when its directory is named here.
      - name: Quilon test suites
        run: |
          ./target/debug/quilon test examples
          ./target/debug/quilon test corelib

      # One series per platform and branch, keyed per commit (caches are immutable)
      # and restored by prefix. A miss just means no delta column.
      - name: Restore benchmark series
        uses: actions/cache/restore@v6
        with:
          path: bench-series.tsv
          key: bench-series-${{ matrix.key }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            bench-series-${{ matrix.key }}-${{ github.ref_name }}-
            bench-series-${{ matrix.key }}-main-

      # Informational: no threshold, no gate. Shared runners are too noisy.
      - name: Benchmarks
        run: |
          set -euo pipefail
          cargo bench --bench compile_speed -- \
            --baseline bench-series.tsv --metrics bench-series.next.tsv | tee compile-bench.txt
          cargo bench --bench runtime_speed -- \
            --baseline bench-series.tsv --metrics bench-series.next.tsv | tee runtime-bench.txt
          mv bench-series.next.tsv bench-series.tsv
          {
            echo "### Benchmarks — ${{ matrix.key }}"
            echo
            echo "Informational — no pass/fail. A \`Δ\` column compares against the"
            echo "previous run on this branch and platform. Shared runners are noisy in"
            echo "absolute terms and only interleaved runs on one machine compare"
            echo "credibly, so a few percent either way is the floor: treat a delta as a"
            echo "hint about where to look, not a verdict. No delta column means there"
            echo "was no previous run to compare against."
            echo
            echo "#### Compile speed"
            echo
            sed -n '/^| corpus/,/^$/p' compile-bench.txt
            grep '^Peak RSS' compile-bench.txt || true
            echo
            echo "#### Generated-code speed"
            echo
            sed -n '/^| program/,/^$/p' runtime-bench.txt
            echo "#### Command latency"
            echo
            sed -n '/^| command/,/^$/p' runtime-bench.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # Pushes only: a PR run measures a different runner under a different load.
      - name: Save benchmark series
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: bench-series.tsv
          key: bench-series-${{ matrix.key }}-${{ github.ref_name }}-${{ github.sha }}
