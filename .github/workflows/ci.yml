name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM 22
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gate-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gate-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: build-and-test (${{ matrix.key }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            runner: ubuntu-latest
            pkg: apt
          - key: linux-aarch64
            runner: ubuntu-24.04-arm
            pkg: apt
          - key: macos-arm64
            runner: macos-latest
            pkg: macos-llvm
          - key: arch-linux
            runner: ubuntu-latest
            container: archlinux:latest
            pkg: pacman

    steps:
      # Before checkout: without git it fetches a tarball, dropping the submodule.
      - name: Install toolchain (pacman)
        if: matrix.pkg == 'pacman'
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm git base-devel llvm clang curl
          git config --global --add safe.directory '*'
          llvm-config --version
          echo "LLVM_SYS_221_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies (apt)
        if: matrix.pkg == 'apt'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      # Same static package release.yml links, not Homebrew's dylib-only llvm@22 —
      # that stayed green while the release build could not link at all.
      - name: Install LLVM 22 (macOS static package)
        if: matrix.pkg == 'macos-llvm'
        run: |
          set -euxo pipefail
          release=22.1.8
          package="LLVM-${release}-macOS-ARM64"
          mkdir -p "$RUNNER_TEMP/llvm"
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-${release}/${package}.tar.xz" \
            | tar -xf - -C "$RUNNER_TEMP/llvm" \
              "${package}/bin/llvm-config" "${package}/include" "${package}/lib"
          prefix="$RUNNER_TEMP/llvm/${package}"
          mode="$("$prefix/bin/llvm-config" --shared-mode)"
          if [ "$mode" != static ]; then
            echo "::error::LLVM at $prefix links $mode, not static"
            exit 1
          fi
          brew list zstd >/dev/null 2>&1 || brew install zstd
          zstd_prefix="$(brew --prefix zstd)"
          if [ -f "$zstd_prefix/lib/libzstd.a" ]; then
            cp "$zstd_prefix/lib/libzstd.a" "$prefix/lib/libzstd.a"
          else
            echo "::error::No static libzstd.a at $zstd_prefix/lib; the link would depend on Homebrew's zstd"
            exit 1
          fi
          for lib in $("$prefix/bin/llvm-config" --system-libs); do
            case "$lib" in
              /*)
                test -f "$lib" && continue
                echo "::error::LLVM links $lib, which is not installed here"
                exit 1
                ;;
            esac
          done
          # Same fixes release.yml needs: force a static zstd (above), drop every
          # libc++/libunwind file the package ships (dylib and static archive both
          # — the static libc++ alone is missing the ABI/exception symbols, and the
          # libunwind dylib has no rpath) so both fall through to the SDK's, and
          # point the linker's bitcode reader at the matching LTO library so
          # Apple's ld can read this LLVM's archives.
          rm -f "$prefix"/lib/libc++* "$prefix"/lib/libunwind*
          {
            echo "LLVM_SYS_221_PREFIX=$prefix"
            echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,-lto_library,$prefix/lib/libLTO.dylib"
          } >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.key }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.key }}-cargo-

      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Quilon test suites
        run: |
          ./target/debug/quilon test examples
          ./target/debug/quilon test corelib

      - name: Restore benchmark series
        uses: actions/cache/restore@v6
        with:
          path: bench-series.tsv
          key: bench-series-${{ matrix.key }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            bench-series-${{ matrix.key }}-${{ github.ref_name }}-
            bench-series-${{ matrix.key }}-main-

      # Informational: no threshold, no gate. Shared runners are too noisy.
      - name: Benchmarks
        run: |
          set -euo pipefail
          cargo bench --bench compile_speed -- \
            --baseline bench-series.tsv --metrics bench-series.next.tsv | tee compile-bench.txt
          cargo bench --bench runtime_speed -- \
            --baseline bench-series.tsv --metrics bench-series.next.tsv | tee runtime-bench.txt
          mv bench-series.next.tsv bench-series.tsv
          {
            echo "### Benchmarks — ${{ matrix.key }}"
            echo
            echo "Informational — no pass/fail. A \`Δ\` column compares against the"
            echo "previous run on this branch and platform. Shared runners are noisy in"
            echo "absolute terms and only interleaved runs on one machine compare"
            echo "credibly, so a few percent either way is the floor: treat a delta as a"
            echo "hint about where to look, not a verdict. No delta column means there"
            echo "was no previous run to compare against."
            echo
            echo "#### Compile speed"
            echo
            sed -n '/^| corpus/,/^$/p' compile-bench.txt
            grep '^Peak RSS' compile-bench.txt || true
            echo
            echo "#### Generated-code speed"
            echo
            sed -n '/^| program/,/^$/p' runtime-bench.txt
            echo "#### Command latency"
            echo
            sed -n '/^| command/,/^$/p' runtime-bench.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save benchmark series
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: bench-series.tsv
          key: bench-series-${{ matrix.key }}-${{ github.ref_name }}-${{ github.sha }}
