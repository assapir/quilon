name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Quilon toolchain
        uses: ./.github/actions/setup-quilon-toolchain
        with:
          llvm-source: apt
          cache-key-prefix: gate
          rustup-components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: build-and-test (${{ matrix.key }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            runner: ubuntu-latest
            pkg: apt
          - key: linux-aarch64
            runner: ubuntu-24.04-arm
            pkg: apt
          - key: macos-arm64
            runner: macos-latest
            pkg: brew
          - key: arch-linux
            runner: ubuntu-latest
            container: archlinux:latest
            pkg: pacman

    steps:
      # Before checkout: without git it fetches a tarball, dropping the submodule.
      - name: Install toolchain (pacman)
        if: matrix.pkg == 'pacman'
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm git base-devel llvm clang curl
          git config --global --add safe.directory '*'
          llvm-config --version
          echo "LLVM_SYS_221_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Quilon toolchain
        uses: ./.github/actions/setup-quilon-toolchain
        with:
          llvm-source: ${{ matrix.pkg }}
          cache-key-prefix: ${{ matrix.key }}

      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Quilon test suites
        run: |
          ./target/debug/quilon test examples
          ./target/debug/quilon test corelib

      - name: Restore benchmark series
        uses: actions/cache/restore@v6
        with:
          path: bench-series.tsv
          key: bench-series-${{ matrix.key }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            bench-series-${{ matrix.key }}-${{ github.ref_name }}-
            bench-series-${{ matrix.key }}-main-

      # Informational: no threshold, no gate. Shared runners are too noisy.
      - name: Benchmarks
        run: |
          set -euo pipefail
          cargo bench --bench compile_speed -- \
            --baseline bench-series.tsv --metrics bench-series.next.tsv | tee compile-bench.txt
          cargo bench --bench runtime_speed -- \
            --baseline bench-series.tsv --metrics bench-series.next.tsv | tee runtime-bench.txt
          mv bench-series.next.tsv bench-series.tsv
          {
            echo "### Benchmarks — ${{ matrix.key }}"
            echo
            echo "Informational — no pass/fail. A \`Δ\` column compares against the"
            echo "previous run on this branch and platform. Shared runners are noisy in"
            echo "absolute terms and only interleaved runs on one machine compare"
            echo "credibly, so a few percent either way is the floor: treat a delta as a"
            echo "hint about where to look, not a verdict. No delta column means there"
            echo "was no previous run to compare against."
            echo
            echo "#### Compile speed"
            echo
            sed -n '/^| corpus/,/^$/p' compile-bench.txt
            grep '^Peak RSS' compile-bench.txt || true
            echo
            echo "#### Generated-code speed"
            echo
            sed -n '/^| program/,/^$/p' runtime-bench.txt
            echo "#### Command latency"
            echo
            sed -n '/^| command/,/^$/p' runtime-bench.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save benchmark series
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: bench-series.tsv
          key: bench-series-${{ matrix.key }}-${{ github.ref_name }}-${{ github.sha }}

  # Mirrors release.yml's macos job for a single `--release --bin quilon` link,
  # so a PR catches a release-link regression without running LTO over ~54
  # test/bench binaries the way build-and-test's full `--all-targets` would.
  # Waits on build-and-test (all legs, macOS included) rather than just gate,
  # so a broken macOS test run blocks this instead of racing it.
  macos-release-link:
    name: macos-release-link
    needs: build-and-test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Quilon toolchain
        uses: ./.github/actions/setup-quilon-toolchain
        with:
          llvm-source: macos-static

      - name: Build release
        run: cargo build --release --bin quilon

      - name: Verify the asset is self-contained
        uses: ./.github/actions/verify-self-contained-asset
        with:
          binary-path: target/release/quilon
