name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # A manual run builds every platform and stops before publishing, so the matrix
  # can be proven without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest

    env:
      ASSET: quilon-x86_64-unknown-linux-gnu
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Boehm GC is a submodule (`quilon-rt/vendor/bdwgc`); the runtime
          # crate's build script compiles it from source.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies
        run: |
          set -euxo pipefail
          # Same toolchain as CI: both C linkers and the LLVM 22 dev libs. The GC is
          # vendored, so there is no libgc package to install.
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        run: |
          set -euo pipefail
          file "$ASSET"
          ldd "$ASSET"
          ./"$ASSET" check examples/hello_world.qn
          # The asset promises it runs on a machine with nothing installed, so a
          # dynamic LLVM is a release-blocking regression rather than a log line.
          if ldd "$ASSET" | grep -qi 'llvm'; then
            echo "::error::$ASSET names an LLVM library: it would not start without LLVM installed"
            exit 1
          fi
          {
            echo "### \`$ASSET\`"
            echo
            echo '```'
            file "$ASSET"
            ldd "$ASSET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  macos:
    name: Build aarch64-apple-darwin
    runs-on: macos-latest

    env:
      ASSET: quilon-aarch64-apple-darwin
      # Homebrew's `llvm@22` is built `LLVM_LINK_LLVM_DYLIB=ON` and ships no static
      # LLVM at all, so a binary linked against it names `libLLVM.dylib` and starts
      # only where that exact formula is installed. The upstream release package is a
      # static build, so this job links the archives from it instead and the asset
      # needs nothing installed.
      LLVM_RELEASE: 22.1.8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM ${{ env.LLVM_RELEASE }}
        run: |
          set -euxo pipefail
          package="LLVM-${LLVM_RELEASE}-macOS-ARM64"
          mkdir -p "$RUNNER_TEMP/llvm"
          # Only what llvm-sys reads — the archives, the headers, and llvm-config.
          # The whole package unpacks to ~8 GB, most of it tools this build never runs.
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_RELEASE}/${package}.tar.xz" \
            | tar -xf - -C "$RUNNER_TEMP/llvm" \
              "${package}/bin/llvm-config" "${package}/include" "${package}/lib"
          prefix="$RUNNER_TEMP/llvm/${package}"
          "$prefix/bin/llvm-config" --version
          # Fail here, with a reason, rather than three steps later with a binary
          # that silently needs an LLVM the user does not have.
          mode="$("$prefix/bin/llvm-config" --shared-mode)"
          if [ "$mode" != static ]; then
            echo "::error::LLVM at $prefix links $mode, not static"
            exit 1
          fi
          # That LLVM was built against Homebrew's zstd and names its static archive by
          # absolute path in `--system-libs`. The archive goes into the binary, so the
          # product depends on nothing, but the link needs the formula present.
          brew list zstd >/dev/null 2>&1 || brew install zstd
          for lib in $("$prefix/bin/llvm-config" --system-libs); do
            case "$lib" in
              /*)
                test -f "$lib" && continue
                echo "::error::LLVM links $lib, which is not installed here"
                exit 1
                ;;
            esac
          done
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        run: |
          set -euo pipefail
          file "$ASSET"
          otool -L "$ASSET"
          ./"$ASSET" check examples/hello_world.qn
          # Anything under a package manager's prefix is a dependency the user
          # would have to install; the system libraries under /usr/lib are on every
          # macOS. LLVM must not appear at all.
          if otool -L "$ASSET" | grep -Ei 'llvm|/opt/homebrew|/usr/local/(opt|Cellar)'; then
            echo "::error::$ASSET names a library outside the macOS system libraries"
            exit 1
          fi
          {
            echo "### \`$ASSET\`"
            echo
            echo '```'
            file "$ASSET"
            otool -L "$ASSET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Every asset or none: a release that quietly omits a platform it advertises is
  # worse than a tag whose build failed in the open and can be re-run. Neither build
  # job is `continue-on-error` for the same reason.
  publish:
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: quilon-*
          merge-multiple: true

      - name: Resolve release codename
        id: codename
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          codename="$(awk -F'\t' -v v="$version" '
            /^#/ || NF < 2 { next }
            { pat = $1; gsub(/\./, "\\.", pat); gsub(/\*/, ".*", pat)
              if (v ~ "^" pat "$") { print $2; exit } }' release-codenames.tsv)"
          if [ -n "$codename" ]; then
            echo "title=Quilon ${GITHUB_REF_NAME} \"${codename}\"" >> "$GITHUB_OUTPUT"
          else
            echo "title=Quilon ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.codename.outputs.title }}
          files: assets/*
          generate_release_notes: true
