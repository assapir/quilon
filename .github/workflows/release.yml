name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # A manual run builds without publishing: prove the build before tagging.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    env:
      ASSET: quilon-linux-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Quilon toolchain
        uses: ./.github/actions/setup-quilon-toolchain
        with:
          llvm-source: apt

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        uses: ./.github/actions/verify-self-contained-asset
        with:
          binary-path: ${{ env.ASSET }}

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  macos:
    name: Build macos-aarch64
    runs-on: macos-latest

    env:
      ASSET: quilon-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Quilon toolchain
        uses: ./.github/actions/setup-quilon-toolchain
        with:
          llvm-source: macos-static

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        uses: ./.github/actions/verify-self-contained-asset
        with:
          binary-path: ${{ env.ASSET }}

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: quilon-*
          merge-multiple: true

      - name: Resolve release codename
        id: codename
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          codename="$(awk -F'\t' -v v="$version" '
            /^#/ || NF < 2 { next }
            { pat = $1; gsub(/\./, "\\.", pat); gsub(/\*/, ".*", pat)
              if (v ~ "^" pat "$") { print $2; exit } }' release-codenames.tsv)"
          if [ -n "$codename" ]; then
            echo "title=Quilon ${GITHUB_REF_NAME} \"${codename}\"" >> "$GITHUB_OUTPUT"
          else
            echo "title=Quilon ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.codename.outputs.title }}
          files: assets/*
          generate_release_notes: true
