name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies
        run: |
          set -euxo pipefail
          # Same toolchain as CI: Boehm GC + both C linkers, LLVM 22 dev libs.
          sudo apt-get update
          sudo apt-get install -y libgc-dev gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --bin quilon

      - name: Resolve release codename
        id: codename
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          codename="$(awk -F'\t' -v v="$version" '
            /^#/ || NF < 2 { next }
            { pat = $1; gsub(/\./, "\\.", pat); gsub(/\*/, ".*", pat)
              if (v ~ "^" pat "$") { print $2; exit } }' release-codenames.tsv)"
          if [ -n "$codename" ]; then
            echo "title=Quilon ${GITHUB_REF_NAME} \"${codename}\"" >> "$GITHUB_OUTPUT"
          else
            echo "title=Quilon ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.codename.outputs.title }}
          files: target/release/quilon
          generate_release_notes: true
