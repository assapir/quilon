name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # A manual run builds without publishing: prove the build before tagging.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    env:
      ASSET: quilon-linux-${{ matrix.arch }}
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        run: |
          set -euo pipefail
          file "$ASSET"
          ldd "$ASSET"
          ./"$ASSET" check examples/hello_world.qn
          if ldd "$ASSET" | grep -qi 'llvm'; then
            echo "::error::$ASSET names an LLVM library: it would not start without LLVM installed"
            exit 1
          fi
          {
            echo "### \`$ASSET\`"
            echo
            echo '```'
            file "$ASSET"
            ldd "$ASSET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  macos:
    name: Build macos-aarch64
    runs-on: macos-latest

    env:
      ASSET: quilon-macos-aarch64
      # Homebrew's llvm@22 is built LLVM_LINK_LLVM_DYLIB=ON and ships no static
      # LLVM, so a binary linked against it needs that exact formula installed to
      # start. The upstream release package is a static build.
      LLVM_RELEASE: 22.1.8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM ${{ env.LLVM_RELEASE }}
        run: |
          set -euxo pipefail
          package="LLVM-${LLVM_RELEASE}-macOS-ARM64"
          mkdir -p "$RUNNER_TEMP/llvm"
          # Only what llvm-sys reads — the archives, the headers, and llvm-config.
          # The whole package unpacks to ~8 GB, most of it tools this build never runs.
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_RELEASE}/${package}.tar.xz" \
            | tar -xf - -C "$RUNNER_TEMP/llvm" \
              "${package}/bin/llvm-config" "${package}/include" "${package}/lib"
          prefix="$RUNNER_TEMP/llvm/${package}"
          "$prefix/bin/llvm-config" --version
          mode="$("$prefix/bin/llvm-config" --shared-mode)"
          if [ "$mode" != static ]; then
            echo "::error::LLVM at $prefix links $mode, not static"
            exit 1
          fi
          # --system-libs names Homebrew's zstd by absolute path; the archive goes
          # into the binary, but the link needs the formula present.
          brew list zstd >/dev/null 2>&1 || brew install zstd
          for lib in $("$prefix/bin/llvm-config" --system-libs); do
            case "$lib" in
              /*)
                test -f "$lib" && continue
                echo "::error::LLVM links $lib, which is not installed here"
                exit 1
                ;;
            esac
          done
          # This package ships its own libc++ (dylib and static archive both) on the
          # same -L path llvm-sys adds for the LLVM archives; either shadows the
          # SDK's, and the static one alone is missing the ABI/exception symbols
          # normally paired with it. Drop every libc++/libc++abi file so -lc++ falls
          # through to the SDK's complete one. libLTO.dylib stays — the next step needs it.
          rm -f "$prefix"/lib/libc++*
          {
            echo "LLVM_SYS_221_PREFIX=$prefix"
            # Apple's ld reads LTO bitcode through libLTO.dylib; the one Xcode
            # ships is an older LLVM than 22 and rejects this package's bitcode
            # archive members. Point it at the matching reader instead.
            echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,-lto_library,$prefix/lib/libLTO.dylib"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        run: |
          set -euo pipefail
          file "$ASSET"
          otool -L "$ASSET"
          ./"$ASSET" check examples/hello_world.qn
          # Only macOS system libraries may appear: an @rpath entry, a Homebrew
          # prefix, or the LLVM package's own libc++/libLLVM is a dependency the
          # asset promises it does not have.
          otool -L "$ASSET" | tail -n +2 | while read -r lib _; do
            case "$lib" in
              /usr/lib/*|/System/Library/*) ;;
              *)
                echo "::error::$ASSET names a non-system library: $lib"
                exit 1
                ;;
            esac
          done
          {
            echo "### \`$ASSET\`"
            echo
            echo '```'
            file "$ASSET"
            otool -L "$ASSET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: quilon-*
          merge-multiple: true

      - name: Resolve release codename
        id: codename
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          codename="$(awk -F'\t' -v v="$version" '
            /^#/ || NF < 2 { next }
            { pat = $1; gsub(/\./, "\\.", pat); gsub(/\*/, ".*", pat)
              if (v ~ "^" pat "$") { print $2; exit } }' release-codenames.tsv)"
          if [ -n "$codename" ]; then
            echo "title=Quilon ${GITHUB_REF_NAME} \"${codename}\"" >> "$GITHUB_OUTPUT"
          else
            echo "title=Quilon ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.codename.outputs.title }}
          files: assets/*
          generate_release_notes: true
