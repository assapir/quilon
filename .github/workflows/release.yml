name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # A manual run builds the release and stops before publishing, so the build can be
  # proven without spending a version number on it. Run it before tagging.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    # Native runners per architecture: the runtime archive bundles a `cc`-compiled
    # Boehm GC and links against the host LLVM, so each target builds on its own
    # machine rather than through a cross toolchain.
    #
    # `arch` is what `uname -m` prints on that machine, so a user picks their asset
    # by running it rather than by decoding a target triple.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    env:
      ASSET: quilon-linux-${{ matrix.arch }}
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Boehm GC is a submodule (`quilon-rt/vendor/bdwgc`); the runtime
          # crate's build script compiles it from source.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies
        run: |
          set -euxo pipefail
          # Same toolchain as CI: both C linkers and the LLVM 22 dev libs. The GC is
          # vendored, so there is no libgc package to install.
          sudo apt-get update
          sudo apt-get install -y gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --bin quilon
          mv target/release/quilon "$ASSET"

      - name: Verify the asset is self-contained
        run: |
          set -euo pipefail
          file "$ASSET"
          ldd "$ASSET"
          ./"$ASSET" check examples/hello_world.qn
          # The asset promises it runs on a machine with nothing installed, so a
          # dynamic LLVM is a release-blocking regression rather than a log line.
          if ldd "$ASSET" | grep -qi 'llvm'; then
            echo "::error::$ASSET names an LLVM library: it would not start without LLVM installed"
            exit 1
          fi
          {
            echo "### \`$ASSET\`"
            echo
            echo '```'
            file "$ASSET"
            ldd "$ASSET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Every asset or none: a release that quietly omits a platform it advertises is
  # worse than a tag whose build failed in the open and can be re-run. The build job
  # is not `continue-on-error` for the same reason.
  publish:
    if: github.event_name == 'push'
    needs: [linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: quilon-*
          merge-multiple: true

      - name: Resolve release codename
        id: codename
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          codename="$(awk -F'\t' -v v="$version" '
            /^#/ || NF < 2 { next }
            { pat = $1; gsub(/\./, "\\.", pat); gsub(/\*/, ".*", pat)
              if (v ~ "^" pat "$") { print $2; exit } }' release-codenames.tsv)"
          if [ -n "$codename" ]; then
            echo "title=Quilon ${GITHUB_REF_NAME} \"${codename}\"" >> "$GITHUB_OUTPUT"
          else
            echo "title=Quilon ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.codename.outputs.title }}
          files: assets/*
          generate_release_notes: true
