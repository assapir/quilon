# pnpm settings for the extension package.
#
# @vscode/vsce-sign and keytar ship native postinstall build scripts that
# pnpm 10+ blocks by default (ERR_PNPM_IGNORED_BUILDS), turning every install
# into a prompt. Neither is needed to *package* the extension (they back
# vsce's optional code-signing and OS-keychain credential storage, used only
# when publishing with a PAT, which CI supplies via env vars), so we record an
# explicit "do not build" decision to keep installs non-interactive and
# deterministic in CI.
allowBuilds:
  "@vscode/vsce-sign": false
  keytar: false

minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm-eabi@1.2.7'
  - '@rolldown/binding-android-arm64@1.2.7'
  - '@rolldown/binding-darwin-arm64@1.2.7'
  - '@rolldown/binding-darwin-x64@1.2.7'
  - '@rolldown/binding-freebsd-x64@1.2.7'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.7'
  - '@rolldown/binding-linux-arm64-gnu@1.2.7'
  - '@rolldown/binding-linux-arm64-musl@1.2.7'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.7'
  - '@rolldown/binding-linux-s390x-gnu@1.2.7'
  - '@rolldown/binding-linux-x64-gnu@1.2.7'
  - '@rolldown/binding-linux-x64-musl@1.2.7'
  - '@rolldown/binding-openharmony-arm64@1.2.7'
  - '@rolldown/binding-win32-arm64-msvc@1.2.7'
  - '@rolldown/binding-win32-x64-msvc@1.2.7'
  - rolldown@1.2.7

# Hoist dependencies flat into node_modules (instead of pnpm's default
# symlinked-store layout) so tools that expect a conventional
# node_modules/<package> layout (rolldown resolving vscode-languageclient at
# bundle time, the extension host resolving it when running unbundled under
# `watch`/F5) find it without extra resolver configuration. pnpm 10+ reads
# this setting from here, not from .npmrc.
nodeLinker: hoisted
